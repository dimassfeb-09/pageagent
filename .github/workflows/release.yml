name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package extension
        run: cd dist && zip -r ../pageagent.zip .
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PageAgent ${{ github.ref_name }}
          generate_release_notes: true
          files: pageagent.zip
