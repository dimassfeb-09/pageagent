<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Variant E - Premium Cards</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e6e7eb;--text:#1f2023;--muted:#6b6c72;--accent:#2563eb}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:32px}
  .wrap{max-width:680px;margin:0 auto}
  h1{font-size:20px;margin:0 0 20px;letter-spacing:-.3px}
  .stack{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .15s,box-shadow .15s}
  .card:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.06)}
  .head{display:flex;align-items:center;gap:12px}
  .icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#f2f3f6;color:#555;flex-shrink:0}
  .card.running .icon{background:#fff4e5;color:#b45309}
  .card.done .icon{background:#ecfdf3;color:#15803d}
  .card.failed .icon{background:#fef2f2;color:#b91c1c}
  .title{font-weight:600;font-size:13.5px;flex:1}
  .status{font-size:11.5px;color:var(--muted)}
  .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .shimmer{height:8px;border-radius:4px;margin:8px 0 2px;background:linear-gradient(90deg,#f0f0f2,#f7f7f8,#f0f0f2);background-size:200% 100%;animation:sh 1.3s linear infinite}
  .shimmer.w{width:100%}.shimmer.m{width:68%}
  .error{margin-top:6px;padding:8px 10px;border-radius:8px;background:#fef2f2;color:#b91c1c;font-size:12px}
  .summary{margin-top:6px;font-size:12px;color:#444}
  .details{margin-top:8px}
  .details summary{cursor:pointer;font-size:11.5px;color:var(--muted);user-select:none}
  .details pre{margin:8px 0 0;padding:10px;border-radius:8px;background:#f7f7f9;font-size:11px;overflow:auto;color:#444}
  .actions{margin-top:8px;display:flex;gap:6px}
  button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Variant E — Premium Cards</h1>
  <div class="stack">
    <div class="card done">
      <div class="head">
        <div class="icon" data-lucide="check"></div>
        <div class="title">Read browser context</div>
        <div class="status">done</div>
      </div>
      <div class="summary">Read 4 tabs: Login, Home, ChatGPT, Extensions</div>
      <details class="details"><summary>Details</summary><pre>tabs: [1566066573, 1566066586, 1566066594, 1566066663]</pre></details>
    </div>
    <div class="card running">
      <div class="head">
        <div class="icon" data-lucide="loader-2" class="spin"></div>
        <div class="title">Find interactive elements</div>
        <div class="status">running</div>
      </div>
      <div class="shimmer w"></div>
      <div class="shimmer m"></div>
    </div>
    <div class="card failed">
      <div class="head">
        <div class="icon" data-lucide="alert-circle"></div>
        <div class="title">Read browser context</div>
        <div class="status">failed</div>
      </div>
      <div class="error">Need page access permission. Open extension settings to grant it.</div>
      <div class="actions"><button class="primary">Retry</button><button>Details</button></div>
    </div>
  </div>
</div>
<script>lucide.createIcons();</script>
<style>.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style>
</body>
</html>
