<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Variant D - Compact Expandable</title>
<style>
  body{font-family:Inter,system-ui,sans-serif;background:#f7f7f8;color:#222;margin:0;padding:24px}
  .wrap{max-width:640px;margin:0 auto}
  h1{font-size:18px;margin:0 0 16px}
  .item{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid #e2e2e5;border-radius:8px;background:#fff;margin-bottom:6px;cursor:pointer}
  .item .icon{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;background:#f4f4f5;color:#666;flex-shrink:0}
  .item .label{flex:1;font-size:13px;font-weight:500}
  .item .meta{font-size:11.5px;color:#888}
  .item.running .meta{color:#b54708}
  .item.failed .meta{color:#b3261e}
  .details{padding:8px 10px 10px;border:1px solid #e2e2e5;border-top:0;border-radius:0 0 8px 8px;background:#fafafa;font-size:11.5px;color:#666;margin:-6px 0 6px}
  .shimmer{height:6px;border-radius:3px;background:linear-gradient(90deg,#eee,#f7f7f8,#eee);background-size:200% 100%;animation:sh 1.3s linear infinite;margin:4px 0}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  button{border:1px solid #e2e2e5;background:#fff;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <h1>Variant D — Compact Expandable</h1>
  <div class="item">
    <div class="icon">✓</div>
    <div class="label">Read browser context</div>
    <div class="meta">4 tabs</div>
  </div>
  <div class="item running">
    <div class="icon">⟳</div>
    <div class="label">Find interactive elements</div>
    <div class="meta">running</div>
  </div>
  <div class="shimmer" style="width:100%"></div>
  <div class="shimmer" style="width:70%"></div>
  <div class="item failed">
    <div class="icon">!</div>
    <div class="label">Read browser context</div>
    <div class="meta">permission needed</div>
  </div>
  <div class="details">
    Need page access permission. <button>Retry</button>
  </div>
</div>
</body>
</html>
